@startuml
!theme plain

actor Client as client
actor "Gestionnaire de magasin" as manager
actor "Gestionnaire de produits" as product_manager
actor "Responsable logistique" as logistics
actor Administrateur as admin

package "Système de gestion de chaîne d'approvisionnement" {
  usecase "Consulter produits" as UC1
  usecase "Effectuer une vente" as UC2
  usecase "Gérer le stock" as UC3
  usecase "Gérer les utilisateurs" as UC4
  usecase "Gérer les magasins" as UC5
  usecase "Gérer le panier" as UC6
  usecase "Gérer la logistique" as UC7
  usecase "Consulter rapports" as UC8
  usecase "Administrer le système" as UC9
}

client - -> UC1
client - -> UC2
client - -> UC6

manager - -> UC1
manager - -> UC2
manager - -> UC3
manager - -> UC8

product_manager - -> UC1
product_manager - -> UC3
product_manager - -> UC8

logistics - -> UC7
logistics - -> UC3
logistics - -> UC8

admin - -> UC4
admin - -> UC5
admin - -> UC9
admin - -> UC8
@enduml

