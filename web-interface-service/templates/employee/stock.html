{% extends "base.html" %}

{% block title %}Gestion du stock - SuperMarché{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Gestion du stock</h2>
            <div class="stock-filters">
                <select id="store-filter" class="form-select" style="width: auto; margin-right: 1rem;">
                    <option value="">Tous les magasins</option>
                </select>
                <input type="text" id="search-stock" class="form-input" placeholder="Rechercher un produit..." style="width: auto;">
            </div>
        </div>
        
        <div id="stock-container">
            <!-- Le stock sera chargé ici via JavaScript -->
        </div>
    </div>
</div>

<!-- Modal pour modifier le stock -->
<div id="update-stock-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Modifier le stock</h3>
            <span class="close" onclick="hideUpdateStockModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="update-stock-form">
                <input type="hidden" id="stock-product-id">
                <div class="form-group">
                    <label for="new-quantity" class="form-label">Nouvelle quantité</label>
                    <input type="number" id="new-quantity" name="quantity" class="form-input" min="0" required>
                </div>
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadStores();
    loadStock();
    
    // Gestion du formulaire de mise à jour du stock
    document.getElementById('update-stock-form').addEventListener('submit', function(e) {
        e.preventDefault();
        updateStock();
    });
    
    // Filtres
    document.getElementById('store-filter').addEventListener('change', function() {
        loadStock();
    });
    
    document.getElementById('search-stock').addEventListener('input', function() {
        filterStock();
    });
});

async function loadStores() {
    try {
        const stores = await ApiService.getStores();
        const selector = document.getElementById('store-filter');
        
        stores.forEach(store => {
            const option = document.createElement('option');
            option.value = store.id;
            option.textContent = store.name;
            selector.appendChild(option);
        });
    } catch (error) {
        console.error('Erreur lors du chargement des magasins:', error);
    }
}

async function loadStock() {
    try {
        const storeId = document.getElementById('store-filter').value;
        const products = await ApiService.getProducts(storeId);
        displayStock(products);
    } catch (error) {
        Utils.showAlert('Erreur lors du chargement du stock', 'error');
    }
}

function displayStock(products) {
    const container = document.getElementById('stock-container');
    
    if (!products || products.length === 0) {
        container.innerHTML = '<div class="alert alert-info">Aucun produit trouvé</div>';
        return;
    }
    
    const stockHtml = products.map(product => {
        const stockClass = product.quantity_stock < 10 ? 'low-stock' : 
                          product.quantity_stock < 50 ? 'medium-stock' : 'good-stock';
        
        return `
            <div class="card stock-card ${stockClass}" style="margin-bottom: 1rem;">
                <div class="card-header">
                    <h3 class="card-title">${product.name}</h3>
                    <span class="stock-badge ${stockClass}">${product.quantity_stock} en stock</span>
                </div>
                <div class="stock-details">
                    <p><strong>Catégorie:</strong> ${product.category}</p>
                    <p><strong>Prix:</strong> ${Utils.formatPrice(product.price)}</p>
                    <p><strong>Magasin:</strong> #${product.store_id}</p>
                    <p><strong>Description:</strong> ${product.description || 'Aucune description'}</p>
                </div>
                <div class="stock-actions">
                    <button class="btn btn-primary btn-sm" onclick="showUpdateStockModal(${product.id}, ${product.quantity_stock})">
                        Modifier le stock
                    </button>
                </div>
            </div>
        `;
    }).join('');
    
    container.innerHTML = stockHtml;
}

function showUpdateStockModal(productId, currentQuantity) {
    document.getElementById('stock-product-id').value = productId;
    document.getElementById('new-quantity').value = currentQuantity;
    document.getElementById('update-stock-modal').style.display = 'flex';
}

function hideUpdateStockModal() {
    document.getElementById('update-stock-modal').style.display = 'none';
}

async function updateStock() {
    const productId = document.getElementById('stock-product-id').value;
    const newQuantity = document.getElementById('new-quantity').value;
    
    try {
        await ApiService.updateStock(productId, parseInt(newQuantity));
        Utils.showAlert('Stock mis à jour avec succès', 'success');
        hideUpdateStockModal();
        loadStock();
    } catch (error) {
        Utils.showAlert('Erreur lors de la mise à jour du stock', 'error');
    }
}

function filterStock() {
    const searchTerm = document.getElementById('search-stock').value.toLowerCase();
    const stockCards = document.querySelectorAll('.stock-card');
    
    stockCards.forEach(card => {
        const productName = card.querySelector('.card-title').textContent.toLowerCase();
        const productCategory = card.querySelector('.stock-details p').textContent.toLowerCase();
        
        if (productName.includes(searchTerm) || productCategory.includes(searchTerm)) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}
</script>

<style>
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-content {
    background: white;
    border-radius: 10px;
    max-width: 500px;
    width: 90%;
}

.modal-header {
    padding: 1.5rem;
    border-bottom: 1px solid #e1e8ed;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-body {
    padding: 1.5rem;
}

.close {
    font-size: 1.5rem;
    cursor: pointer;
    color: #747d8c;
}

.close:hover {
    color: #2f3542;
}

.stock-badge {
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
}

.stock-badge.low-stock {
    background: #f8d7da;
    color: #721c24;
}

.stock-badge.medium-stock {
    background: #fff3cd;
    color: #856404;
}

.stock-badge.good-stock {
    background: #d4edda;
    color: #155724;
}

.low-stock {
    border-left: 4px solid #dc3545;
}

.medium-stock {
    border-left: 4px solid #ffc107;
}

.good-stock {
    border-left: 4px solid #28a745;
}
</style>
{% endblock %}
