events {
    worker_connections 1024;
}

http {
    upstream api_gateway {
        server api-gateway:5000;
    }

    upstream store_service {
        server store-service:5001;
    }

    upstream product_service {
        server product-service:5002;
    }

    upstream sales_service {
        server sales-service:5003;
    }

    upstream inventory_service {
        server inventory-service:5004;
    }

    upstream customer_service {
        server customer-service:5005;
    }

    upstream cart_service {
        server cart-service:5006;
    }

    upstream checkout_service {
        server checkout-service:5007;
    }

    # Configuration pour l'API Gateway (point d'entrée principal)
    server {
        listen 80;
        server_name localhost;

        # Toutes les requêtes passent par l'API Gateway
        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks pour tous les services
        location /health/api-gateway {
            proxy_pass http://api_gateway/health;
        }

        location /health/store-service {
            proxy_pass http://store_service/health;
        }

        location /health/product-service {
            proxy_pass http://product_service/health;
        }

        location /health/sales-service {
            proxy_pass http://sales_service/health;
        }

        location /health/inventory-service {
            proxy_pass http://inventory_service/health;
        }

        location /health/customer-service {
            proxy_pass http://customer_service/health;
        }

        location /health/cart-service {
            proxy_pass http://cart_service/health;
        }

        location /health/checkout-service {
            proxy_pass http://checkout_service/health;
        }

        # Métriques Prometheus
        location /metrics {
            proxy_pass http://api_gateway/metrics;
        }
    }

    # Configuration pour accès direct aux services (développement)
    server {
        listen 8001;
        server_name localhost;
        
        location / {
            proxy_pass http://store_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8002;
        server_name localhost;
        
        location / {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8003;
        server_name localhost;
        
        location / {
            proxy_pass http://sales_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8004;
        server_name localhost;
        
        location / {
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8005;
        server_name localhost;
        
        location / {
            proxy_pass http://customer_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8006;
        server_name localhost;
        
        location / {
            proxy_pass http://cart_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8007;
        server_name localhost;
        
        location / {
            proxy_pass http://checkout_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
