{% extends "base.html" %}

{% block title %}Modifier Magasin{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-edit me-2"></i>Modifier Magasin</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_store', store_id=store.id) }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nom du magasin</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ store.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address" class="form-label">Adresse</label>
                            <input type="text" class="form-control" id="address" name="address" 
                                   value="{{ store.address }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="phone" class="form-label">Téléphone</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   value="{{ store.phone or '' }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="manager" class="form-label">Responsable</label>
                            <input type="text" class="form-control" id="manager" name="manager" 
                                   value="{{ store.manager or '' }}">
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-2"></i>Enregistrer
                            </button>
                            <a href="{{ url_for('stores') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Retour
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
