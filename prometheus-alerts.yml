groups:
  - name: microservices-alerts
    rules:
      # Alertes pour les microservices
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} service on {{ $labels.instance }} has been down for more than 30 seconds."

      - alert: HighErrorRate
        expr: rate(flask_http_request_exceptions_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "{{ $labels.job }} has error rate of {{ $value }} errors per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(flask_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "{{ $labels.job }} has 95th percentile response time of {{ $value }} seconds"

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "Database {{ $labels.job }} has {{ $value }} active connections"

      - alert: RedisMemoryUsageHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage is {{ $value | humanizePercentage }}"

      - alert: DiskSpaceUsageHigh
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space usage high"
          description: "Disk space usage is {{ $value | humanizePercentage }}"

  - name: api-gateway-alerts
    rules:
      - alert: APIGatewayHighLoad
        expr: rate(flask_http_request_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Gateway high load"
          description: "API Gateway receiving {{ $value }} requests per second"

      - alert: APIGatewayTimeout
        expr: increase(flask_http_request_duration_seconds_count[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway timeouts"
          description: "API Gateway has {{ $value }} timeouts in the last 5 minutes"
